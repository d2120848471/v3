# 在 Windows 上构建免安装分发包
#
# PyInstaller 不能交叉编译：macOS/Linux 上产不出 Windows 的 exe。手边没有
# Windows 机器时，用这个工作流在 GitHub 的 windows-latest runner 上构建，
# 跑完从 Artifacts 里下载 zip 即可。
#
# 触发方式：仓库 Actions 页面手动运行，或推一个 v* 标签。

name: build-windows

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建分发包
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AliSlider-win64
          path: dist/AliSlider-win64.zip
          if-no-files-found: error
          retention-days: 14
