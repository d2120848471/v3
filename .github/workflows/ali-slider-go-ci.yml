name: ali-slider-go-ci

on:
  pull_request:
    paths:
      - "ali-slider-go/**"
      - ".github/workflows/ali-slider-go-ci.yml"
      - ".gitattributes"
  push:
    branches:
      - main
    paths:
      - "ali-slider-go/**"
      - ".github/workflows/ali-slider-go-ci.yml"
      - ".gitattributes"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ali-slider-go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ali-slider-go
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ali-slider-go/go.mod
          check-latest: false
          cache: false

      # 工具下载与漏洞库查询不运行项目代码，也不携带真实目标配置。
      # 下方测试本身全部使用 Mock/静态 fixture，不访问验证码、设备 RPC、CDN 或代理。
      - name: Install pinned analysis tools
        env:
          GOBIN: ${{ runner.temp }}/ali-slider-go-tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Download and verify locked Go dependencies
        run: |
          go mod download
          go mod verify
          test "$(go list -m -f '{{.Version}}' github.com/ebitengine/purego)" = "v0.10.2"

      - name: Formatting and static analysis
        env:
          GOPROXY: "off"
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          staticcheck ./...

      - name: Unit, integration, architecture and fuzz seeds
        env:
          GOPROXY: "off"
        run: |
          go test -count=1 ./...

      - name: Coverage gates
        env:
          GOPROXY: "off"
        run: |
          go test -count=1 -coverprofile="${RUNNER_TEMP}/all.cover" ./...
          total="$(go tool cover -func="${RUNNER_TEMP}/all.cover" | awk '/^total:/{gsub(/%/,"",$3); print $3}')"
          awk -v got="${total}" 'BEGIN { if (got + 0 < 80) exit 1 }'

          go test -count=1 -coverprofile="${RUNNER_TEMP}/protocol.cover" ./internal/domain/protocol
          protocol="$(go tool cover -func="${RUNNER_TEMP}/protocol.cover" | awk '/^total:/{gsub(/%/,"",$3); print $3}')"
          awk -v got="${protocol}" 'BEGIN { if (got + 0 < 90) exit 1 }'

          go test -count=1 -coverprofile="${RUNNER_TEMP}/vision.cover" ./internal/domain/vision
          vision="$(go tool cover -func="${RUNNER_TEMP}/vision.cover" | awk '/^total:/{gsub(/%/,"",$3); print $3}')"
          awk -v got="${vision}" 'BEGIN { if (got + 0 < 90) exit 1 }'

          printf 'coverage total=%s%% protocol=%s%% vision=%s%%\n' "${total}" "${protocol}" "${vision}"

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Linux AMD64 Go launcher build
        env:
          GOPROXY: "off"
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o "${RUNNER_TEMP}/ali-slider-go-linux-amd64" ./cmd/server
          file "${RUNNER_TEMP}/ali-slider-go-linux-amd64" | grep -q "x86-64"
          readelf -d "${RUNNER_TEMP}/ali-slider-go-linux-amd64" | grep -q "libdl.so.2"

  race:
    name: Go race detector (Darwin)
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ali-slider-go
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ali-slider-go/go.mod
          check-latest: false
          cache: false

      - name: Download and verify locked Go dependencies
        run: |
          go mod download
          go mod verify

      # Linux 的 Go race runtime 强制依赖 CGo；Darwin 可在 CGO_ENABLED=0
      # 下运行同一门禁，因此不为测试工具链放宽项目的纯 Go 边界。
      - name: Race detector
        env:
          GOPROXY: "off"
        run: go test -count=1 -race ./...

  linux-runtime:
    name: Linux ${{ matrix.arch }} V8 runtime and package
    needs:
      - quality
      - race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Test native wrapper in target architecture
        run: |
          docker buildx build \
            --file ali-slider-go/build/docker/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --target native-test \
            --progress plain \
            ali-slider-go

      - name: Test Go-to-V8 ABI and browser bridges
        run: |
          docker buildx build \
            --file ali-slider-go/build/docker/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --target v8-test \
            --progress plain \
            ali-slider-go

      - name: Build image and export runnable files
        run: |
          image="ali-slider-go-ci:${{ matrix.arch }}"
          package_dir="${RUNNER_TEMP}/ali-slider-go-linux-${{ matrix.arch }}"
          mkdir -p "${package_dir}"
          docker buildx build \
            --file ali-slider-go/build/docker/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --load \
            --tag "${image}" \
            --progress plain \
            ali-slider-go
          docker buildx build \
            --file ali-slider-go/build/docker/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --target package \
            --output "type=local,dest=${package_dir}" \
            --progress plain \
            ali-slider-go

          file "${package_dir}/ali-slider-go" "${package_dir}/libali_slider_v8_runtime.so"
          test -x "${package_dir}/ali-slider-go"
          test -s "${package_dir}/libali_slider_v8_runtime.so"
          test -s "${package_dir}/THIRD-PARTY-NOTICES.txt"
          case "${{ matrix.arch }}" in
            amd64) expected_arch="x86-64" ;;
            arm64) expected_arch="ARM aarch64" ;;
          esac
          file "${package_dir}/ali-slider-go" | grep -q "${expected_arch}"
          file "${package_dir}/libali_slider_v8_runtime.so" | grep -q "${expected_arch}"

          container="$(docker run --detach --platform "linux/${{ matrix.arch }}" \
            --env ALI_SLIDER_HOST=0.0.0.0 \
            --publish 127.0.0.1::8000 \
            "${image}" --device-prewarm=0)"
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' "${container}")"
          ready=0
          for attempt in $(seq 1 60); do
            if ! docker inspect --format '{{.State.Running}}' "${container}" | grep -qx true; then
              docker logs "${container}"
              exit 1
            fi
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health" |
              grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "${ready}" = "1"
          docker logs "${container}"
          docker rm --force "${container}" >/dev/null
          trap - EXIT

          tar -C "${package_dir}" -czf \
            "${RUNNER_TEMP}/ali-slider-go-linux-${{ matrix.arch }}.tar.gz" .
          sha256sum "${RUNNER_TEMP}/ali-slider-go-linux-${{ matrix.arch }}.tar.gz"

      - name: Upload Linux package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ali-slider-go-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ali-slider-go-linux-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  windows-package:
    name: Windows AMD64 portable package
    needs:
      - quality
      - race
      - linux-runtime
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: ali-slider-go
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ali-slider-go/go.mod
          check-latest: false
          cache: false

      - name: Verify and test on Windows
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -count=1 ./...

      - name: Build and test pinned V8 wrapper
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup override set 1.88.0

          Push-Location native/v8runtime
          cargo test `
            --release `
            --locked
          cargo build `
            --release `
            --locked
          Pop-Location

          $library = (Resolve-Path `
            "native/v8runtime/target/release/ali_slider_v8_runtime.dll").Path
          $env:ALI_SLIDER_V8_TEST_LIBRARY = $library
          go test `
            -count=1 `
            -run "TestNativeLibraryIntegration|TestV8BundlesParseInNativeEngine|TestKeyResolverChecksNativeRuntime" `
            ./internal/platform/v8runtime ./internal/infrastructure/engine
          Remove-Item Env:ALI_SLIDER_V8_TEST_LIBRARY

      - name: Build and assemble portable package
        run: |
          $packageName = "ali-slider-go-windows-amd64"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          $zipPath = Join-Path $env:RUNNER_TEMP "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          go build `
            -trimpath `
            -buildvcs=true `
            -ldflags="-s -w -buildid=" `
            -o (Join-Path $packageDir "ali-slider-go.exe") `
            ./cmd/server

          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed"
          }

          Copy-Item `
            "build/packaging/windows/start.bat" `
            (Join-Path $packageDir "start.bat")

          Copy-Item `
            "native/v8runtime/target/release/ali_slider_v8_runtime.dll" `
            (Join-Path $packageDir "ali_slider_v8_runtime.dll")
          Copy-Item `
            "native/v8runtime/THIRD-PARTY-NOTICES.txt" `
            (Join-Path $packageDir "THIRD-PARTY-NOTICES.txt")

          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $utf8WithBOM = [System.Text.UTF8Encoding]::new($true)
          $readme = Get-Content `
            -LiteralPath "build/packaging/windows/README-Windows.txt" `
            -Encoding utf8 `
            -Raw
          [IO.File]::WriteAllText(
            (Join-Path $packageDir "README-Windows.txt"),
            $readme,
            $utf8WithBOM
          )

          $buildInfo = @(
            "project=ali-slider-go"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "go=$(go version)"
            "goos=windows"
            "goarch=amd64"
            "cgo=0"
            "rust=$(rustc --version)"
            "v8=149.4.0"
            "builtAtUTC=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          [IO.File]::WriteAllLines(
            (Join-Path $packageDir "BUILD-INFO.txt"),
            [string[]]$buildInfo,
            $utf8
          )

          $checksumNames = @(
            "ali-slider-go.exe"
            "ali_slider_v8_runtime.dll"
            "BUILD-INFO.txt"
            "README-Windows.txt"
            "THIRD-PARTY-NOTICES.txt"
            "start.bat"
          ) | Sort-Object
          $checksumLines = foreach ($name in $checksumNames) {
            $hash = (Get-FileHash `
              -Algorithm SHA256 `
              (Join-Path $packageDir $name)).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $packageDir "SHA256SUMS.txt"),
            [string[]]$checksumLines,
            $utf8
          )

          Compress-Archive `
            -Path (Join-Path $packageDir "*") `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          "WINDOWS_PACKAGE_ZIP=$zipPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_SHA256=$((Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify extracted package and smoke-test executable
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "便携 包 verify"
          Expand-Archive `
            -LiteralPath $env:WINDOWS_PACKAGE_ZIP `
            -DestinationPath $verifyDir

          $expected = @(
            "ali-slider-go.exe"
            "ali_slider_v8_runtime.dll"
            "BUILD-INFO.txt"
            "README-Windows.txt"
            "SHA256SUMS.txt"
            "THIRD-PARTY-NOTICES.txt"
            "start.bat"
          ) | Sort-Object
          $actual = Get-ChildItem -Path $verifyDir -File |
            Select-Object -ExpandProperty Name |
            Sort-Object
          $difference = Compare-Object $expected $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Error
            throw "Unexpected portable-package contents"
          }

          $exe = Join-Path $verifyDir "ali-slider-go.exe"
          $header = [IO.File]::ReadAllBytes($exe)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "Packaged executable is not a PE file"
          }
          $v8Library = Join-Path $verifyDir "ali_slider_v8_runtime.dll"
          $v8Header = [IO.File]::ReadAllBytes($v8Library)
          if ($v8Header.Length -lt 2 -or $v8Header[0] -ne 0x4d -or $v8Header[1] -ne 0x5a) {
            throw "Packaged V8 runtime is not a PE file"
          }
          $readmeBytes = [IO.File]::ReadAllBytes((Join-Path $verifyDir "README-Windows.txt"))
          if ($readmeBytes.Length -lt 3 -or
              $readmeBytes[0] -ne 0xef -or
              $readmeBytes[1] -ne 0xbb -or
              $readmeBytes[2] -ne 0xbf) {
            throw "Packaged Windows README is missing the UTF-8 BOM"
          }

          $recordedChecksums = @{}
          foreach ($line in Get-Content (Join-Path $verifyDir "SHA256SUMS.txt")) {
            if ($line -notmatch "^([0-9a-f]{64})  (.+)$") {
              throw "Malformed SHA256SUMS entry: $line"
            }
            if ($recordedChecksums.ContainsKey($Matches[2])) {
              throw "Duplicate SHA256SUMS entry: $($Matches[2])"
            }
            $recordedChecksums[$Matches[2]] = $Matches[1]
          }
          $hashedNames = $expected | Where-Object { $_ -ne "SHA256SUMS.txt" }
          if ($recordedChecksums.Count -ne $hashedNames.Count) {
            throw "Unexpected SHA256SUMS entry count"
          }
          foreach ($name in $hashedNames) {
            if (-not $recordedChecksums.ContainsKey($name)) {
              throw "Missing SHA256SUMS entry: $name"
            }
            $actualHash = (Get-FileHash `
              -Algorithm SHA256 `
              (Join-Path $verifyDir $name)).Hash.ToLowerInvariant()
            if ($recordedChecksums[$name] -ne $actualHash) {
              throw "Packaged file checksum mismatch: $name"
            }
          }

          $stdout = Join-Path $env:RUNNER_TEMP "windows-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "windows-smoke.stderr.log"
          $smokeArtifacts = Join-Path $verifyDir "var\artifacts"
          New-Item -ItemType Directory -Force -Path $smokeArtifacts | Out-Null
          $arguments = @(
            "/d"
            "/c"
            "start.bat"
            "--host=127.0.0.1"
            "--port=18080"
            "--device-prewarm=0"
          )
          $launcher = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList $arguments `
            -WorkingDirectory $verifyDir `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($launcher.HasExited) {
                throw "Packaged start.bat exited with code $($launcher.ExitCode)"
              }
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:18080/health" `
                  -TimeoutSec 1
                if ($health.ok -eq $true -and $health.status -eq "ready") {
                  $ready = $true
                  break
                }
              } catch {
                # 服务尚未 ready，继续有界轮询。
              }
            }
            if (-not $ready) {
              throw "Packaged executable did not become ready"
            }

            $serverProcesses = @(
              Get-Process -Name "ali-slider-go" -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $exe }
            )
            if ($serverProcesses.Count -ne 1) {
              throw "start.bat did not create exactly one packaged executable"
            }

            $pageResponse = Invoke-WebRequest `
              -Uri "http://127.0.0.1:18080/" `
              -TimeoutSec 2
            $pageContentType = [string]$pageResponse.Headers["Content-Type"]
            $pageCSP = [string]$pageResponse.Headers["Content-Security-Policy"]
            if ($pageResponse.StatusCode -ne 200 -or $pageContentType -notmatch "^text/html(?:;|$)") {
              throw "Packaged API test page returned status $($pageResponse.StatusCode) and Content-Type '$pageContentType'"
            }
            if (-not $pageResponse.Content.Contains('id="api-test-console"') -or
                -not $pageResponse.Content.Contains('fetch("/api/slider"')) {
              throw "Packaged API test page is missing its stable marker or same-origin solve path"
            }
            if ($pageCSP -notmatch "connect-src 'self'" -or
                $pageCSP -match "unsafe-inline" -or
                [string]$pageResponse.Headers["Cache-Control"] -ne "no-store" -or
                [string]$pageResponse.Headers["X-Content-Type-Options"] -ne "nosniff" -or
                [string]$pageResponse.Headers["Referrer-Policy"] -ne "no-referrer") {
              throw "Packaged API test page security-header contract failed"
            }

            $openapiResponse = Invoke-WebRequest `
              -Uri "http://127.0.0.1:18080/openapi.json" `
              -TimeoutSec 2
            $openapiDocument = $openapiResponse.Content |
              ConvertFrom-Json -AsHashtable
            $openapiVersion = [string]$openapiDocument["openapi"]
            if ($openapiVersion -ne "3.0.3") {
              throw "Packaged executable returned OpenAPI version '$openapiVersion'"
            }
            if (-not $openapiDocument["paths"].ContainsKey("/")) {
              throw "Packaged OpenAPI document is missing the API test page path"
            }
            $solvePath = $openapiDocument["paths"]["/api/slider"]
            if (-not $solvePath.ContainsKey("get") -or
                -not $solvePath.ContainsKey("post") -or
                $solvePath["get"]["deprecated"] -ne $true) {
              throw "Packaged OpenAPI is missing the deprecated legacy GET query operation"
            }
            foreach ($method in @("get", "post")) {
              $solveResponses = $solvePath[$method]["responses"]
              if (-not $solveResponses.ContainsKey("403") -or $solveResponses.ContainsKey("429")) {
                throw "Packaged OpenAPI $method solve responses do not match the 403/no-429 contract"
              }
            }

            $legacyInvalid = Invoke-WebRequest `
              -Method Get `
              -Uri "http://127.0.0.1:18080/api/slider?SceneId=legacy&prefix=bad-prefix" `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
            $legacyInvalidBody = $legacyInvalid.Content |
              ConvertFrom-Json -AsHashtable
            $legacyInvalidTraceHeader = [string]$legacyInvalid.Headers["X-Trace-ID"]
            $legacyInvalidTraceBody = [string]$legacyInvalidBody["traceId"]
            if ($legacyInvalid.StatusCode -ne 400 -or
                [string]$legacyInvalidBody["errorType"] -ne "ApiRequestError" -or
                [string]::IsNullOrWhiteSpace($legacyInvalidTraceHeader) -or
                $legacyInvalidTraceHeader -ne $legacyInvalidTraceBody) {
              throw "Legacy GET query routing and validation smoke failed"
            }

            $crossOriginHeaders = @{
              "Origin" = "https://attacker.example"
              "Sec-Fetch-Site" = "cross-site"
            }
            $crossOriginGET = Invoke-WebRequest `
              -Method Get `
              -Uri "http://127.0.0.1:18080/api/slider?prefix=bad-prefix" `
              -Headers $crossOriginHeaders `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
            $crossOriginPOST = Invoke-WebRequest `
              -Method Post `
              -Uri "http://127.0.0.1:18080/api/slider" `
              -Headers $crossOriginHeaders `
              -ContentType "application/json" `
              -Body "[]" `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
            foreach ($crossOrigin in @($crossOriginGET, $crossOriginPOST)) {
              $crossOriginBody = $crossOrigin.Content |
                ConvertFrom-Json -AsHashtable
              $crossOriginTraceHeader = [string]$crossOrigin.Headers["X-Trace-ID"]
              $crossOriginTraceBody = [string]$crossOriginBody["traceId"]
              if ($crossOrigin.StatusCode -ne 403 -or
                  [string]$crossOriginBody["errorType"] -ne "ApiOriginError" -or
                  [string]::IsNullOrWhiteSpace($crossOriginTraceHeader) -or
                  $crossOriginTraceHeader -ne $crossOriginTraceBody) {
                throw "Cross-origin browser boundary smoke failed"
              }
            }

            $invalid = Invoke-WebRequest `
              -Method Post `
              -Uri "http://127.0.0.1:18080/api/slider" `
              -ContentType "application/json" `
              -Body "[]" `
              -SkipHttpErrorCheck `
              -TimeoutSec 2
            if ($invalid.StatusCode -ne 400) {
              throw "Invalid JSON contract smoke returned $($invalid.StatusCode)"
            }
          } finally {
            $packagedServers = @(
              Get-Process -Name "ali-slider-go" -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $exe }
            )
            foreach ($serverProcess in $packagedServers) {
              if (-not $serverProcess.HasExited) {
                Stop-Process -Id $serverProcess.Id -Force
                $serverProcess.WaitForExit(5000) | Out-Null
              }
            }
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
              $launcher.WaitForExit(5000) | Out-Null
            }
            if (Test-Path $stdout) {
              Get-Content $stdout | Write-Host
            }
            if (Test-Path $stderr) {
              Get-Content $stderr | Write-Host
            }
          }

          $startupLog = Get-Content -Raw $stdout
          if ($startupLog -match "artifact_purge status=warning") {
            throw "Windows artifact startup purge reported a warning"
          }

      - name: Upload shareable Windows ZIP
        if: github.event_name != 'pull_request'
        id: windows-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/ali-slider-go-windows-amd64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Record Windows package evidence
        if: github.event_name != 'pull_request'
        run: |
          $artifactDigest = "${{ steps.windows-artifact.outputs.artifact-digest }}"
          if ($artifactDigest -ne $env:WINDOWS_PACKAGE_SHA256) {
            throw "Uploaded artifact digest does not match package SHA-256"
          }
          "### Windows portable package" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``${{ github.sha }}``" >> $env:GITHUB_STEP_SUMMARY
          "- File: ``ali-slider-go-windows-amd64.zip``" >> $env:GITHUB_STEP_SUMMARY
          "- ZIP SHA-256: ``$env:WINDOWS_PACKAGE_SHA256``" >> $env:GITHUB_STEP_SUMMARY
          "- Retention: 30 days" >> $env:GITHUB_STEP_SUMMARY
